# GeM-Sentinel — full stack (optional; local non-Docker runs are supported too).
#
#   docker compose up --build
#   docker compose exec backend python -m app.seed
#
# Then open http://localhost:3000.

name: gem-sentinel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gemsentinel
      POSTGRES_PASSWORD: gemsentinel123
      POSTGRES_DB: gem_sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemsentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-portals:
    image: python:3.12-slim
    working_dir: /srv
    command: >
      sh -c "pip install --quiet fastapi uvicorn httpx &&
             uvicorn main:app --host 0.0.0.0 --port 8001"
    volumes:
      - ./mock-govt-portals:/srv
    ports:
      - "8001:8001"

  backend:
    image: python:3.12-slim
    working_dir: /srv
    command: >
      sh -c "pip install --quiet -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://gemsentinel:gemsentinel123@postgres:5432/gem_sentinel
      MOCK_PORTAL_URL: http://mock-portals:8001
      ENVIRONMENT: development
    volumes:
      - ./backend:/srv
      - ./storage:/storage
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-portals:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /srv
    command: sh -c "npm install && npm run build && npx next start -H 0.0.0.0 -p 3000"
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./frontend:/srv
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
